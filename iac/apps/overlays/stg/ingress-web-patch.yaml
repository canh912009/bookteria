apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookteria-web
spec:
  tls:
    - hosts:
        - web.stg.bookteria.local
      secretName: bookteria-web-stg-tls
  rules:
    - host: web.stg.bookteria.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  name: http
