apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookteria-stg

resources:
  - ../../base

secretGenerator:
  - name: bookteria-app-secret
    envs:
      - secret.example.env

patches:
  - path: namespace-patch.yaml
    target:
      kind: Namespace
      name: bookteria
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: bookteria-app-config
  - path: ingress-api-patch.yaml
  - path: ingress-web-patch.yaml
images:
  - name: ghcr.io/your-org/bookteria/api-gateway
    newTag: stg
  - name: ghcr.io/your-org/bookteria/identity-service
    newTag: stg
  - name: ghcr.io/your-org/bookteria/profile-service
    newTag: stg
  - name: ghcr.io/your-org/bookteria/notification-service
    newTag: stg
  - name: ghcr.io/your-org/bookteria/post-service
    newTag: stg
  - name: ghcr.io/your-org/bookteria/file-service
    newTag: stg
  - name: ghcr.io/your-org/bookteria/chat-service
    newTag: stg
  - name: ghcr.io/your-org/bookteria/web-app
    newTag: stg
