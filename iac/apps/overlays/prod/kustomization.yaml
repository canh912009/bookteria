apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookteria-prod

resources:
  - ../../base
  - hpa.yaml

secretGenerator:
  - name: bookteria-app-secret
    envs:
      - secret.example.env

patches:
  - path: namespace-patch.yaml
    target:
      kind: Namespace
      name: bookteria
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: bookteria-app-config
  - path: ingress-api-patch.yaml
  - path: ingress-web-patch.yaml
  - path: api-gateway-resources-patch.yaml
  - path: file-service-pvc-patch.yaml

replicas:
  - name: api-gateway
    count: 2
  - name: identity-service
    count: 2
  - name: profile-service
    count: 2
  - name: notification-service
    count: 2
  - name: post-service
    count: 2
  - name: chat-service
    count: 2
  - name: web-app
    count: 2

images:
  - name: ghcr.io/your-org/bookteria/api-gateway
    newTag: prod
  - name: ghcr.io/your-org/bookteria/identity-service
    newTag: prod
  - name: ghcr.io/your-org/bookteria/profile-service
    newTag: prod
  - name: ghcr.io/your-org/bookteria/notification-service
    newTag: prod
  - name: ghcr.io/your-org/bookteria/post-service
    newTag: prod
  - name: ghcr.io/your-org/bookteria/file-service
    newTag: prod
  - name: ghcr.io/your-org/bookteria/chat-service
    newTag: prod
  - name: ghcr.io/your-org/bookteria/web-app
    newTag: prod
