apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookteria-api
spec:
  tls:
    - hosts:
        - api.bookteria.local
      secretName: bookteria-api-prod-tls
  rules:
    - host: api.bookteria.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
