apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: file-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-service
    spec:
      containers:
        - name: file-service
          image: ghcr.io/your-org/bookteria/file-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: bookteria-app-config
            - secretRef:
                name: bookteria-app-secret
          env:
            - name: SPRING_DATA_MONGODB_DATABASE
              value: file-service
            - name: SPRING_DATA_MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bookteria-app-secret
                  key: MONGODB_ROOT_USERNAME
            - name: SPRING_DATA_MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookteria-app-secret
                  key: MONGODB_ROOT_PASSWORD
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: file-service-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-service-uploads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
